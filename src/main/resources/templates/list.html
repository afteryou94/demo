<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        /* 페이징 번호 간격 등 커스텀 CSS */
        .page-link { color: #333; }
        .active > .page-link { background-color: #198754; border-color: #198754; }
    </style>
</head>
<body>

<nav class="navbar navbar-light bg-light mb-4">
    <div class="container mt-2">
        <a class="navbar-brand fw-bold" href="/board/">My Board</a>
        <div class="text-end">
            <div th:if="${session.loginEmail == null}">
                <a href="/oauth2/authorization/google" class="btn btn-sm btn-outline-danger">구글 로그인</a>
                <a href="/oauth2/authorization/naver" class="btn btn-sm btn-outline-success">네이버 로그인</a>
                <a href="/member/login" class="btn btn-sm btn-outline-primary">로그인</a>
                <a href="/member/save" class="btn btn-sm btn-outline-secondary">회원가입</a>
            </div>

            <div th:if="${session.loginEmail != null}">
                <span class="me-2 fw-bold" th:text="${session.loginNickname} + '님 환영합니다!'"></span>
                <a href="/member/update" class="btn btn-sm btn-primary">정보 수정</a>
                <a href="/member/logout" class="btn btn-sm btn-danger">로그아웃</a>
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4">게시글 목록</h2>

    <table class="table table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Writer</th>
            <th>Date</th>
            <th>Hits</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="board: ${boardList}">
            <td th:text="${board.id}"></td>
            <td>
                <a th:href="@{|/board/${board.id}|}" th:text="${board.boardTitle}"
                   class="text-decoration-none text-dark fw-bold"></a>
            </td>
            <td th:text="${board.boardWriter}"></td>
            <td th:text="${board.boardCreatedAt}"></td>
            <td><span class="badge bg-info text-dark" th:text="${board.boardHits}"></span></td>
        </tr>
        </tbody>
    </table>

    <div class="d-flex justify-content-between mt-3">
        <button class="btn btn-secondary" onclick="joinReq()">회원가입</button>
        <button class="btn btn-success" onclick="saveReq()">글작성</button>
    </div>

    <div class="row justify-content-center mt-5">
        <div class="col-md-8">
            <form action="/board/" method="get" class="input-group mb-3 shadow-sm">
                <select name="type" class="form-select" style="max-width: 130px;">
                    <option value="all" th:selected="${type == 'all'}">제목+내용</option>
                    <option value="title" th:selected="${type == 'title'}">제목</option>
                    <option value="contents" th:selected="${type == 'contents'}">내용</option>
                    <option value="writer" th:selected="${type == 'writer'}">작성자</option>
                </select>
                <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="검색어를 입력하세요">
                <button class="btn btn-success" type="submit">🔍 검색</button>
            </form>
        </div>
    </div>

    <nav aria-label="Page navigation" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item">
                <a class="page-link" th:href="@{/board/(page=1)}">First</a>
            </li>
            <li class="page-item" th:classappend="${boardList.first} ? 'disabled'">
                <a class="page-link" th:href="${boardList.first} ? '#' : @{/board/(page=${boardList.number})}">Prev</a>
            </li>

            <li class="page-item" th:each="page: ${#numbers.sequence(startPage, endPage)}"
                th:classappend="${page == boardList.number + 1} ? 'active'">
                <a class="page-link" th:href="@{/board/(page=${page}, type=${type}, keyword=${keyword})}" th:text="${page}"></a>
            </li>

            <li class="page-item" th:classappend="${boardList.last} ? 'disabled'">
                <a class="page-link" th:href="${boardList.last} ? '#' : @{/board/(page=${boardList.number + 2})}">Next</a>
            </li>
            <li class="page-item">
                <a class="page-link" th:href="@{/board/(page=${boardList.totalPages})}">Last</a>
            </li>
        </ul>
    </nav>
</div>

<script>
    const saveReq = () => { location.href = "/board/save"; }
    const joinReq = () => { location.href = "/member/save"; }
</script>
</body>
</html>
