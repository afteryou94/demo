<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>list</title>
</head>
<body>
<div style="text-align: right; padding: 10px;">
    <div th:if="${session.loginEmail == null}">
        <a href="/oauth2/authorization/google">구글 계정으로 로그인</a> <br>
        <a href="/oauth2/authorization/naver">네이버 계정으로 로그인</a> <br>
        <a href="/member/login">로그인</a>
        <a href="/member/save">회원가입</a>
    </div>

    <div th:if="${session.loginEmail != null}">
        <span th:text="${session.loginNickname} + '님 환영합니다!'"></span>
        <a href="/member/update" class="btn btn-primary">내 정보 수정</a>
        <a href="/member/logout" class="btn btn-danger">로그아웃</a>
    </div>
</div>

<h2>게시글 목록</h2>
<table>
    <tr>
        <th>id</th>
        <th>title</th>
        <th>writer</th>
        <th>date</th>
        <th>hits</th>
    </tr>
    <tr th:each="board: ${boardList}">
        <td th:text="${board.id}"></td>
        <td><a th:href="@{|/board/${board.id}|}" th:text="${board.boardTitle}"></a></td>
        <td th:text="${board.boardWriter}"></td>
        <td th:text="${board.boardCreatedAt}"></td>
        <td th:text="${board.boardHits}"></td>
    </tr>
</table>

<button onclick="saveReq()">글작성</button>
<button onclick="joinReq()">회원가입</button>

<!--검색 기능-->
<div class="search-container" style="text-align: center; margin-top: 20px;">
    <form action="/board/" method="get">
        <select name="type">
            <option value="all">제목+내용</option>
            <option value="title">제목</option>
            <option value="contents">내용</option>
            <option value="writer">작성자</option>
        </select>
        <div style="display: flex; justify-content: center; margin: 30px 0;">
            <form action="/board/" method="get" style="display: flex; align-items: center; gap: 10px;">
                <select name="type" style="padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
                    <option value="all" th:selected="${type == 'all'}">제목+내용</option>
                    <option value="title" th:selected="${type == 'title'}">제목</option>
                    <option value="contents" th:selected="${type == 'contents'}">내용</option>
                    <option value="writer" th:selected="${type == 'writer'}">작성자</option>
                </select>

                <div style="position: relative;">
                    <span style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #888;">🔍</span>
                    <input type="text" name="keyword" th:value="${keyword}" placeholder="검색어를 입력하세요"
                           style="padding: 8px 8px 8px 35px; width: 250px; border-radius: 5px; border: 1px solid #ccc;">
                </div>

                <button type="submit" style="padding: 8px 20px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer;">
                    검색
                </button>
            </form>
        </div>


<div>
    <a th:href="@{/board/(page=1)}">First</a>

    <a th:href="${boardList.first} ? '#' : @{/board/(page=${boardList.number})}">prev</a>

    <span th:each="page: ${#numbers.sequence(startPage, endPage)}">
        <span th:if="${page == boardList.number + 1}" th:text="${page}"></span>
        <span th:unless="${page == boardList.number + 1}">
            <a th:href="@{/board/(page=${page}, type=${type}, keyword=${keyword})}" th:text="${page}"></a>
        </span>
    </span>

    <a th:href="${boardList.last} ? '#' : @{/board/(page=${boardList.number + 2})}">next</a>

    <a th:href="@{/board/(page=${boardList.totalPages})}">Last</a>
</div>


<script>
    const saveReq = () => {
        location.href = "/board/save";
    }
    const joinReq = () => {
        location.href = "/member/save";
    }
</script>
</body>
</html>
