<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>삭제 비밀번호 확인 - My Board</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    body { background-color: #f8f9fa; }
    .check-container { max-width: 400px; margin-top: 150px; }
    .card { border: none; border-radius: 15px; }
  </style>
</head>
<body>

<div class="container check-container">
  <div class="card shadow">
    <div class="card-body p-4 text-center">
      <h4 class="fw-bold mb-3">비밀번호 확인</h4>
      <p class="text-muted small mb-4">게시글 삭제를 위해 <br>작성 시 설정한 비밀번호를 입력해주세요.</p>

      <form th:action="@{/board/delete}" method="post">
        <input type="hidden" name="id" th:value="${id}">

        <div class="mb-3">
          <input type="password" name="boardPass" class="form-control form-control-lg text-center"
                 placeholder="비밀번호 입력" required autofocus>

          <div th:if="${errorMessage}" class="text-danger small mt-2">
            <i class="bi bi-exclamation-circle"></i>
            <span th:text="${errorMessage}">비밀번호가 일치하지 않습니다.</span>
          </div>
          <div th:if="${param.error}" class="text-danger small mt-2">
            비밀번호가 일치하지 않습니다.
          </div>
        </div>

        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-danger btn-lg fw-bold">삭제하기</button>
          <button type="button" class="btn btn-light" th:onclick="|location.href='@{/board/{id}(id=${id})}'|">취소</button>
        </div>
      </form>
    </div>
  </div>
  <div class="text-center mt-3">
    <a href="/board/" class="text-muted text-decoration-none small">← 목록으로 돌아가기</a>
  </div>
</div>

</body>
</html>
