<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>글쓰기 - My Board</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .save-container { max-width: 800px; margin-top: 50px; }
        .form-control:focus { border-color: #198754; box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.25); }
    </style>
</head>
<body>

<div class="container save-container mb-5">
    <div class="card shadow border-0">
        <div class="card-header bg-success text-white py-3">
            <h4 class="mb-0 fw-bold">새 글 작성</h4>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/board/save}" th:object="${boardDTO}" method="post">

                <div th:if="${session.loginEmail != null}" class="alert alert-light border mb-4 d-flex align-items-center">
                    <span class="badge bg-success me-2">작성자</span>
                    <strong th:text="${session.loginNickname}"></strong>님, 유익한 정보를 공유해 주세요!
                    <input type="hidden" th:field="*{boardWriter}" th:value="${session.loginNickname}">
                </div>

                <div th:if="${session.loginEmail == null}" class="mb-4">
                    <div class="alert alert-warning d-flex align-items-center shadow-sm mb-4" role="alert">
                        <div class="me-auto">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            로그인 없이도 글 작성이 가능하지만, <strong>로그인하시면</strong> 작성한 글을 더 편하게 관리할 수 있습니다.
                        </div>
                        <a href="/member/login" class="btn btn-sm btn-dark px-3 fw-bold">로그인하러 가기</a>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted">작성자(비로그인)</label>
                            <input type="text" th:field="*{boardWriter}" class="form-control bg-light" placeholder="이름을 입력하세요"
                                   th:classappend="${#fields.hasErrors('boardWriter')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{boardWriter}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted">비밀번호</label>
                            <input type="password" th:field="*{boardPass}" class="form-control bg-light" placeholder="삭제 시 필요합니다"
                                   th:classappend="${#fields.hasErrors('boardPass')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{boardPass}"></div>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label th:for="boardTitle" class="form-label fw-bold">제목</label>
                    <input type="text" th:field="*{boardTitle}" class="form-control form-control-lg" placeholder="제목을 입력해 주세요">
                    <p th:if="${#fields.hasErrors('boardTitle')}"
                       th:errors="*{boardTitle}" style="color: red;"></p>
                </div>

                <div class="mb-4">
                    <label th:for="boardContents" class="form-label fw-bold">내용</label>
                    <textarea th:field="*{boardContents}" class="form-control" rows="12" placeholder="내용을 작성해 주세요"></textarea>
                    <p th:if="${#fields.hasErrors('boardContents')}"
                       th:errors="*{boardContents}" style="color: red;"></p>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="/board/" class="btn btn-outline-secondary px-4">취소</a>
                    <button type="submit" class="btn btn-success px-5 fw-bold">글작성 완료</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
