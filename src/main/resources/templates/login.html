<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
</head>
<body>
<h2>로그인</h2>
<p th:if="${loginErrorMsg}" th:text="${loginErrorMsg}" style="color: red;"></p>

<form action="/member/login" method="post">
    ID: <input type="text" name="memberId"><br>
    PW: <input type="password" name="memberPassword"><br>
    <input type="submit" value="로그인">
</form>

<hr>

<div class="social-login">
    <a href="/oauth2/authorization/google">구글 계정으로 로그인</a> <br>
    <a href="/oauth2/authorization/naver">네이버 계정으로 로그인</a>
</div>

<hr>

<p>아직 회원이 아니신가요? <a href="/member/save">회원가입 하기</a></p>
</body>
</html>
