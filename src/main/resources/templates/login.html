<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 - My Board</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .login-container { max-width: 400px; margin-top: 100px; }
        .btn-google { background-color: #ffffff; border: 1px solid #ced4da; color: #444; }
        .btn-google:hover { background-color: #f1f1f1; }
        .btn-naver { background-color: #03C75A; color: white; border: none; }
        .btn-naver:hover { background-color: #02b350; color: white; }
    </style>
</head>
<body>

<div class="container login-container">
    <div class="card shadow border-0">
        <div class="card-body p-5">
            <h2 class="text-center fw-bold mb-4">로그인</h2>

            <div th:if="${loginErrorMsg}" class="alert alert-danger py-2 small text-center" role="alert">
                <span th:text="${loginErrorMsg}"></span>
            </div>

            <form action="/member/login" method="post">
                <div class="form-floating mb-3">
                    <input type="text" name="memberId" class="form-control" id="floatingInput" placeholder="ID">
                    <label for="floatingInput">아이디</label>
                </div>

                <div class="form-floating mb-4">
                    <input type="password" name="memberPassword" class="form-control" id="floatingPassword" placeholder="Password">
                    <label for="floatingPassword">비밀번호</label>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary btn-lg fw-bold">로그인</button>
                </div>
            </form>

            <div class="text-center my-3 text-muted small">
                <hr class="d-inline-block w-25"> 또는 <hr class="d-inline-block w-25">
            </div>

            <div class="d-grid gap-2">
                <a href="/oauth2/authorization/google" class="btn btn-google d-flex align-items-center justify-content-center py-2">
                    <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" width="20" class="me-2">
                    구글 계정으로 로그인
                </a>
                <a href="/oauth2/authorization/naver" class="btn btn-naver d-flex align-items-center justify-content-center py-2 fw-bold">
                    네이버 로그인
                </a>
            </div>

            <div class="text-center mt-4">
                <p class="small text-muted mb-0">아직 회원이 아니신가요?</p>
                <a href="/member/save" class="text-decoration-none fw-bold text-primary">회원가입 하기</a>
            </div>
        </div>
    </div>

    <div class="text-center mt-3">
        <a href="/board/" class="text-muted text-decoration-none small">← 게시판 목록으로 돌아가기</a>
    </div>
</div>

</body>
</html>
