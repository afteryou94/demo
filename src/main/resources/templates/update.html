<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>update</title>
</head>
<body>
<div th:if="${errorMessage}" style="color: red;" th:text="${errorMessage}"></div>

<form action="/board/update" method="post">
    <input type="hidden" name="id" th:value="${boardUpdate.id}">

    <div th:if="${session.loginEmail == null}">
        <input type="password" name="boardPass" placeholder="기존 비밀번호 입력" required>
    </div>
    <div th:if="${session.loginEmail != null}">
        <input type="hidden" name="boardPass" th:value="${boardUpdate.boardPass}">
    </div>

    <input type="text" name="boardTitle" th:value="${boardUpdate.boardTitle}">
    <textarea name="boardContents" th:text="${boardUpdate.boardContents}"></textarea>
    <button type="submit">수정완료</button>
</form>
<script th:if="${errorMessage}">
    alert('[[${errorMessage}]]');
</script>
</body>
</html>
