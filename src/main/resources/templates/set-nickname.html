<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <meta charset="UTF-8">
    <title>닉네임 설정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <meta name="_csrf" th:content="${_csrf.token}"/>
        <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card shadow border-0" style="max-width: 400px; width: 100%;">
        <div class="card-body p-5">
            <h3 class="text-center fw-bold mb-4">닉네임 설정</h3>
            <p class="text-center text-muted small mb-4">반갑습니다! 서비스에서 사용할<br>닉네임을 정해주세요.</p>

            <form th:action="@{/member/set-nickname}" method="post" th:object="${updateDTO}">
                <input type="hidden" name="memberEmail" th:value="${memberEmail}">

                <div class="mb-4">
                    <label class="form-label fw-bold">닉네임</label>
                    <input type="text" name="memberNickname" id="memberNickname"
                           class="form-control" placeholder="2~10자 이내"
                           required onblur="nicknameCheck()">
                    <div class="text-danger small" th:if="${#fields.hasErrors('memberNickname')}" th:errors="*{memberNickname}"></div>
                    <div id="nickname-check-result" class="valid-msg mt-1"></div>
                </div>
                <div class="d-grid">
                    <button type="submit" id="submitBtn" class="btn btn-primary btn-lg" disabled>설정 완료</button>
                </div>
            </form>

            <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
            <script>
                const nicknameCheck = () => {
                    const token = document.querySelector('meta[name="_csrf"]').content;
                    const header = document.querySelector('meta[name="_csrf_header"]').content;
                    const nickname = document.getElementById("memberNickname").value;
                    const checkResult = document.getElementById("nickname-check-result");
                    const submitBtn = document.getElementById("submitBtn");
                    // 1. 정규표현식 정의 (특수문자/공백 제외 2~10자)
                    const nickRegex = /^[a-zA-Z0-9가-힣]{2,10}$/;

                    if (!nickRegex.test(nickname)) {
                        checkResult.className = "valid-msg mt-1 text-danger";
                        checkResult.innerText = "특수문자와 공백 없이 2~10자로 입력해주세요.";
                        submitBtn.disabled = true; // 유효하지 않으면 버튼 비활성화

                        return;
                    }



                    $.ajax({
                    type: "post",
                    url: "/member/nickname-check",
                    data: { "memberNickname": nickname },
                    beforeSend: function(xhr) { xhr.setRequestHeader(header, token); },
                    success: function(res) {
                        if (res.trim() === "ok") {
                            checkResult.className = "valid-msg mt-1 text-success";
                            checkResult.innerText = "사용 가능한 닉네임입니다.";
                            submitBtn.disabled = false;
                        } else {
                            checkResult.className = "valid-msg mt-1 text-danger";
                            checkResult.innerText = "이미 사용중인 닉네임입니다.";
                            submitBtn.disabled = true;
                        }
                    }
                });
            };

            </script>
        </div>
    </div>
</div>
</body>
</html>
