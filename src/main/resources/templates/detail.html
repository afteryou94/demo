<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${board.boardTitle} + ' - 상세보기'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .comment-section { background-color: #f8f9fa; border-radius: 10px; padding: 20px; }
        .comment-card { border: none; border-bottom: 1px solid #dee2e6; border-radius: 0; }
        .comment-card:last-child { border-bottom: none; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-light bg-white shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/board/">My Board</a>
        <div class="text-end">
            <div th:if="${session.loginEmail == null}">
                <a href="/member/login" class="btn btn-sm btn-outline-primary">로그인</a>
            </div>
            <div th:if="${session.loginEmail != null}">
                <span class="me-2 fw-bold" th:text="${session.loginNickname} + '님'"></span>
                <a href="/member/logout" class="btn btn-sm btn-outline-danger">로그아웃</a>
            </div>
        </div>
    </div>
</nav>

<div class="container mb-5">
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-white py-3">
            <h3 class="fw-bold mb-2" th:text="${board.boardTitle}">제목</h3>
            <div class="d-flex justify-content-between text-muted small">
                <div>
                    작성자: <span class="fw-bold text-dark" th:text="${board.boardWriter}"></span> |
                    날짜: <span th:text="${board.boardCreatedAt}"></span>
                </div>
                <div>
                    조회수: <span class="badge bg-secondary" th:text="${board.boardHits}"></span>
                </div>
            </div>
        </div>
        <div class="card-body p-4" style="min-height: 300px; white-space: pre-wrap;">
            <p class="card-text" th:text="${board.boardContents}">내용이 들어갑니다.</p>
        </div>
        <div class="card-footer bg-white d-flex justify-content-between py-3">
            <button class="btn btn-outline-secondary" onclick="listReq()">목록으로</button>

            <div th:if="${session.loginEmail == board.memberEmail}">
                <button class="btn btn-warning" th:onclick="|location.href='@{/board/update/{id}(id=${board.id})}'|">수정하기</button>
                <button class="btn btn-danger" onclick="deleteConfirm()">삭제하기</button>
            </div>
        </div>
    </div>

    <div class="comment-section shadow-sm">
        <h5 class="fw-bold mb-3">💬 댓글 <span class="text-success" th:text="${commentList.size()}">0</span></h5>

        <div class="card mb-4 border-0 shadow-sm">
            <div class="card-body">
                <div th:if="${session.loginEmail == null}" class="row g-2 mb-2">
                    <div class="col-md-3">
                        <input type="text" id="commentWriter" class="form-control form-control-sm" placeholder="작성자(2~10자)">
                    </div>
                    <div class="col-md-3">
                        <input type="password" id="commentPass" class="form-control form-control-sm" placeholder="비밀번호(4자 이상)">
                    </div>
                </div>
                <textarea id="commentContents" class="form-control mb-2" rows="3" placeholder="따뜻한 댓글을 남겨주세요."></textarea>
                <div class="d-flex justify-content-end">
                    <button class="btn btn-success px-4" onclick="commentWrite()">댓글등록</button>
                </div>
            </div>
        </div>

        <div id="comment-list">
            <div th:each="comment: ${commentList}" class="card comment-card bg-transparent">
                <div class="card-body px-0">
                    <div class="d-flex justify-content-between mb-2">
                        <h6 class="fw-bold mb-0" th:text="${comment.commentWriter}">작성자</h6>
                        <small class="text-muted" th:text="${comment.commentCreatedAt}">2026-02-18</small>
                    </div>
                    <p class="mb-2" th:id="'contents-' + ${comment.id}" th:text="${comment.commentContents}">댓글 내용</p>
                    <div class="d-flex gap-2 justify-content-end">
                        <button class="btn btn-link btn-sm text-decoration-none p-0 text-warning" th:onclick="showUpdateForm([[${comment.id}]])">수정</button>
                        <button class="btn btn-link btn-sm text-decoration-none p-0 text-danger" th:onclick="commentDelete([[${comment.id}]])">삭제</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const listReq = () => { location.href = "/board/"; }

    const deleteConfirm = () => {
        if (confirm("정말로 이 게시글을 삭제하시겠습니까?")) {
            location.href = "/board/delete/" + [[${board.id}]];
        }
    }

    // 댓글 작성/수정/삭제 관련 JS 코드는 기존 코드를 유지하시되,
    // 성공 시 alert 후 location.reload()를 사용하여 UI가 갱신되게 하시면 됩니다.
</script>
</body>
</html>
