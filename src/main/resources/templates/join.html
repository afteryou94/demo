<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <meta charset="UTF-8">
  <title>회원가입 - My Board</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    /* 화면 중앙 정렬과 에러 메시지 스타일을 지정합니다. */
    body { background-color: #f8f9fa; }
    .join-container { max-width: 500px; margin-top: 50px; }
    .guide-text { font-size: 0.8rem; color: #6c757d; margin-top: 4px; }
    .valid-msg { font-size: 0.85rem; }
  </style>
</head>
<body>

<div class="container join-container">
  <div class="card shadow border-0">
    <div class="card-body p-5">
      <h2 class="text-center fw-bold mb-4">회원가입</h2>

      <form th:action="@{/member/save}" th:object="${memberDTO}" method="post" id="saveForm">

        <div class="mb-3">
          <label for="memberId" class="form-label fw-bold">아이디</label>
          <input type="text" th:field="*{memberId}" class="form-control" id="memberId"
                 maxlength="16" placeholder="아이디를 입력하세요" onblur="idCheck()">
          <div th:if="${#fields.hasErrors('memberId')}" th:errors="*{memberId}" class="text-danger small mt-1"></div>
          <div id="id-check-result" class="valid-msg mt-1"></div>
        </div>

        <div class="mb-3">
          <label for="memberPassword" class="form-label fw-bold">비밀번호</label>
          <input type="password" th:field="*{memberPassword}" class="form-control" id="memberPassword" placeholder="비밀번호 입력" oninput="pwCheck()">
          <div th:if="${#fields.hasErrors('memberPassword')}" th:errors="*{memberPassword}" class="text-danger small mt-1"></div>
          <div id="pw-check-msg" class="valid-msg mt-1"></div>
          <small class="guide-text d-block">영문 대 소문자, 숫자, 특수문자를 포함하여 8~16자를 사용하세요.</small>
        </div>

        <div class="mb-3">
          <label for="memberNickname" class="form-label fw-bold">닉네임</label>
          <input type="text" th:field="*{memberNickname}" class="form-control" id="memberNickname"
                 placeholder="닉네임 입력" onblur="nicknameCheck()">
          <div th:if="${#fields.hasErrors('memberNickname')}" th:errors="*{memberNickname}" class="text-danger small mt-1"></div>
          <div id="nickname-check-result" class="valid-msg mt-1"></div>
        </div>

        <div class="mb-3">
          <label for="memberEmail" class="form-label fw-bold">이메일</label>
          <div class="input-group">
            <input type="email" th:field="*{memberEmail}" class="form-control" id="memberEmail" placeholder="example@email.com">
            <button class="btn btn-outline-secondary" type="button" onclick="sendEmail()">인증번호 전송</button>
          </div>
          <div th:if="${#fields.hasErrors('memberEmail')}" th:errors="*{memberEmail}" class="text-danger small mt-1"></div>
        </div>

        <div class="input-group mb-3">
          <input type="text" id="authCode" class="form-control" placeholder="인증번호 6자리 입력">
          <span id="timer" class="input-group-text text-danger">03:00</span>
          <button class="btn btn-outline-secondary" type="button" onclick="checkAuthCode()">인증확인</button>
        </div>
        <div id="reSendArea" style="display: none;">
          <p class="text-muted small">시간이 만료되었나요?</p>
          <button type="button" class="btn btn-sm btn-warning" onclick="sendEmail()">인증번호 재발송</button>
        </div>

        <div class="d-grid shadow-sm">
          <input type="submit" value="회원가입 완료" id="submitBtn" class="btn btn-primary btn-lg" disabled>
        </div>
      </form>

      <div class="text-center mt-4">
        <a href="/member/login" class="text-decoration-none small text-muted">이미 계정이 있으신가요? 로그인</a>
      </div>
    </div>
  </div>
</div>

<script th:inline="javascript">
  /* [상태 변수 선언] */
  let isIdChecked = false;         // 아이디 체크 완료 여부
  let isPasswordChecked = false;   // 비밀번호 체크 완료 여부
  let isEmailAuthChecked = false;  // 이메일 인증 완료 여부
  let isNicknameChecked = false;   // 닉네임 체크 완료 여부
  let serverAuthCode = "";         // 서버 인증번호 저장
  let timerInterval; // 타이머를 멈추기 위한 변수

  /**
   * [함수: 가입 버튼 상태 업데이트]
   * 모든 체크 항목이 true일 때만 버튼 활성화
   */
  const updateSubmitButton = () => {
    const submitBtn = document.getElementById("submitBtn");

    // 디버깅용 로그
    console.log("상태 - ID:", isIdChecked, "PW:", isPasswordChecked, "Email:", isEmailAuthChecked, "Nick:", isNicknameChecked);

    if (isIdChecked && isPasswordChecked && isEmailAuthChecked && isNicknameChecked) {
        submitBtn.disabled = false;
    } else {
        submitBtn.disabled = true;
    }
  };

  /**
   * [함수: 1. 아이디 유효성 및 중복 체크]
   */
  const idCheck = () => {
    const token = document.querySelector('meta[name="_csrf"]').content;
    const header = document.querySelector('meta[name="_csrf_header"]').content;
    const id = document.getElementById("memberId").value;
    const checkResult = document.getElementById("id-check-result");
    const idRegex = /^[a-zA-Z0-9]{6,16}$/;

    if (!idRegex.test(id)) {
        checkResult.className = "valid-msg mt-1 text-danger";
        checkResult.innerText = "6~16자의 영문 대소문자, 숫자만 사용 가능합니다. (공백 불가)";
        isIdChecked = false;
        updateSubmitButton();
        return;
    }

    $.ajax({
        type: "post",
        url: "/member/id-check",
        data: { "memberId": id },
        beforeSend: function(xhr) { xhr.setRequestHeader(header, token); },
        success: function(res) {
            if (res.replace(/\s/g, "") === "ok") {
                checkResult.className = "valid-msg mt-1 text-success";
                checkResult.innerText = "사용 가능한 ID입니다.";
                isIdChecked = true;
            } else {
                checkResult.className = "valid-msg mt-1 text-danger";
                checkResult.innerText = "이미 사용중인 ID입니다.";
                isIdChecked = false;
            }
            updateSubmitButton();
        }
    });
  };

  /**
   * [함수: 2. 비밀번호 실시간 유효성 체크]
   */
  function pwCheck() {
    const password = document.getElementById("memberPassword").value;
    const pwMsg = document.getElementById("pw-check-msg");
    const pwRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,16}$/;

    if (password.length === 0) {
        pwMsg.innerText = "";
        isPasswordChecked = false;
    } else if (!pwRegex.test(password)) {
        pwMsg.className = "valid-msg mt-1 text-danger";
        pwMsg.innerText = "대/소문자, 숫자, 특수문자를 모두 포함하여 8~16자로 입력해주세요. (공백 불가)";
        isPasswordChecked = false;
    } else {
        pwMsg.className = "valid-msg mt-1 text-success";
        pwMsg.innerText = "안전한 비밀번호입니다.";
        isPasswordChecked = true;
    }
    updateSubmitButton();
  }

  /**
   * [함수: 3. 닉네임 유효성 및 중복 체크]
   */
  const nicknameCheck = () => {
    const token = document.querySelector('meta[name="_csrf"]').content;
    const header = document.querySelector('meta[name="_csrf_header"]').content;
    const nickname = document.getElementById("memberNickname").value.trim();
    const checkResult = document.getElementById("nickname-check-result");
    const nickRegex = /^[a-zA-Z0-9가-힣]{2,10}$/;

    if (!nickRegex.test(nickname)) {
        checkResult.className = "valid-msg mt-1 text-danger";
        checkResult.innerText = "특수문자와 공백 없이 2~10자로 입력해주세요.";
        isNicknameChecked = false;
        updateSubmitButton();
        return;
    }

    $.ajax({
        type: "post",
        url: "/member/nickname-check",
        data: { "memberNickname": nickname },
        beforeSend: function(xhr) { xhr.setRequestHeader(header, token); },
        success: function(res) {
            if (res.trim() === "ok") {
                checkResult.className = "valid-msg mt-1 text-success";
                checkResult.innerText = "사용 가능한 닉네임입니다.";
                isNicknameChecked = true;
            } else {
                checkResult.className = "valid-msg mt-1 text-danger";
                checkResult.innerText = "이미 사용중인 닉네임입니다.";
                isNicknameChecked = false;
            }
            updateSubmitButton();
        }
    });
  };

  /**
   * [함수: 4. 이메일 인증 발송]
   */
  function sendEmail() {
    const token = document.querySelector('meta[name="_csrf"]').content;
    const header = document.querySelector('meta[name="_csrf_header"]').content;
    const email = document.getElementById("memberEmail").value;

    if(!email) {
        alert("이메일을 입력해주세요.");
        return;
    }

    $.ajax({
        type: "post",
        url: "/member/mail-auth",
        data: { "memberEmail": email },
        beforeSend: function(xhr) { xhr.setRequestHeader(header, token); },
        success: function(res) {
            if (res === "duplicate") {
                alert("이미 사용 중인 이메일입니다. 다른 이메일을 입력해 주세요.");
                $("#memberEmail").val("").focus();
            } else {
                alert("인증번호가 발송되었습니다.");
                // [인증 시간] 메일 발송 성공 시 타이머를 시작합니다.
                startTimer();
            }
        },
        error: function(err) { alert("메일 발송 중 오류가 발생했습니다."); }
    });
  }

const startTimer = () => {
    let timeLeft = 180; // 3분 = 180초
    const timerDisplay = document.getElementById("timer");
    const reSendArea = document.getElementById("reSendArea");

    // 기존에 돌아가던 타이머가 있다면 초기화 (재발송 시 대비)
    if (timerInterval) clearInterval(timerInterval);
    reSendArea.style.display = "none";

    timerInterval = setInterval(() => {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;

        // 초가 10보다 작으면 앞에 0을 붙여줌 (예: 02:09)
        seconds = seconds < 10 ? '0' + seconds : seconds;
        timerDisplay.innerText = `0${minutes}:${seconds}`;

        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            timerDisplay.innerText = "시간 만료";
            reSendArea.style.display = "block"; // 재발송 버튼 영역 노출
            isEmailAuthChecked = false; // 인증 상태 초기화
            updateSubmitButton(); // 가입 버튼 상태 업데이트
        }
        timeLeft--;
    }, 1000);
};


  /**
   * [함수: 5. 인증번호 확인]
   */
  const checkAuthCode = () => {
    const userCode = document.getElementById("authCode").value;

    $.ajax({
        type: "post",
        url: "/member/verify-code",
        data: { "userCode": userCode },
        success: function(res) {
            if (res === "success") {
                clearInterval(timerInterval); // 타이머 정지
                document.getElementById("timer").innerText = "인증완료";
                document.getElementById("timer").classList.replace("text-danger", "text-success");
                document.getElementById("authCode").readOnly = true; // 입력창 잠금

                // [추가] 인증 성공 상태 반영
                isEmailAuthChecked = true;
                alert("인증에 성공하였습니다.");
            } else if (res === "timeout" || res === "expired") {
                alert("인증 시간이 만료되었습니다. 다시 시도해주세요.");
                isEmailAuthChecked = false;
            } else {
                alert("인증번호가 일치하지 않습니다.");
                isEmailAuthChecked = false;
            }
            // 가입 버튼 상태 실시간 업데이트
            updateSubmitButton();
        }
    });
};
</script>
</script>
</body>
</html>
