<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>회원가입 - My Board</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    body { background-color: #f8f9fa; }
    .join-container { max-width: 500px; margin-top: 50px; }
    .guide-text { font-size: 0.8rem; color: #6c757d; margin-top: 4px; }
    .valid-msg { font-size: 0.85rem; }
  </style>
</head>
<body>

<div class="container join-container">
  <div class="card shadow border-0">
    <div class="card-body p-5">
      <h2 class="text-center fw-bold mb-4">회원가입</h2>

      <form action="/member/save" method="post" id="saveForm">

        <div class="mb-3">
          <label for="memberId" class="form-label fw-bold">아이디</label>
          <input type="text" name="memberId" class="form-control" id="memberId"
                 maxlength="16" placeholder="아이디를 입력하세요" onblur="idCheck()">
          <div id="id-check-result" class="valid-msg mt-1"></div>
        </div>

        <div class="mb-3">
          <label for="memberPassword" class="form-label fw-bold">비밀번호</label>
          <input type="password" name="memberPassword" class="form-control" id="memberPassword" placeholder="비밀번호 입력">
          <div id="pw-check-msg" class="valid-msg mt-1"></div>
          <small class="guide-text d-block">
            영문 대 소문자, 숫자, 특수문자를 포함하여 8~16자를 사용하세요.
          </small>
        </div>

        <div class="mb-3">
          <label for="memberNickname" class="form-label fw-bold">닉네임</label>
          <input type="text" name="memberNickname" class="form-control" id="memberNickname"
                 placeholder="닉네임 입력" onblur="nicknameCheck()">
          <div id="nickname-check-result" class="valid-msg mt-1"></div>
          <small class="guide-text d-block">
            공백 제외 2~10자를 사용하세요.
          </small>
        </div>

        <div class="mb-3">
          <label for="memberEmail" class="form-label fw-bold">이메일</label>
          <div class="input-group">
            <input type="email" name="memberEmail" class="form-control" id="memberEmail" placeholder="example@email.com">
            <button class="btn btn-outline-secondary" type="button" onclick="sendEmail()">인증번호 전송</button>
          </div>
        </div>

        <div class="mb-4">
          <label for="authCode" class="form-label fw-bold">인증번호 입력</label>
          <div class="input-group">
            <input type="text" id="authCode" class="form-control" placeholder="인증번호 6자리">
            <button class="btn btn-outline-primary" type="button" onclick="checkAuthCode()">확인</button>
          </div>
          <div id="mail-check-result" class="valid-msg mt-1"></div>
        </div>

        <div class="d-grid shadow-sm">
          <input type="submit" value="회원가입 완료" id="submitBtn" class="btn btn-primary btn-lg" disabled>
        </div>
      </form>

      <div class="text-center mt-4">
        <a href="/member/login" class="text-decoration-none small text-muted">이미 계정이 있으신가요? 로그인</a>
      </div>
    </div>
  </div>
</div>

<script th:inline="javascript">
  let isIdChecked = false;
  let isEmailAuthChecked = false;
  let isNicknameChecked = false;
  let serverAuthCode = "";

  // [수정] 통합된 버튼 활성화 제어 함수 (하나만 두세요)
  const updateSubmitButton = () => {
    const submitBtn = document.getElementById("submitBtn");
    console.log("상태체크 - ID:", isIdChecked, "Email:", isEmailAuthChecked, "Nick:", isNicknameChecked);

    if (isIdChecked && isEmailAuthChecked && isNicknameChecked) {
        submitBtn.disabled = false;
    } else {
        submitBtn.disabled = true;
    }
  };

  // 1. 아이디 중복 체크
  const idCheck = () => {
      const id = document.getElementById("memberId").value;
      const checkResult = document.getElementById("id-check-result");

      if (id.length < 6) {
          checkResult.className = "valid-msg mt-1 text-danger";
          checkResult.innerText = "아이디는 6자 이상이어야 합니다.";
          isIdChecked = false;
          updateSubmitButton();
          return;
      }

      $.ajax({
          type: "post",
          url: "/member/id-check",
          data: { "memberId": id },
          // success 부분 수정
success: function(res) {
    console.log("서버가 보낸 응답: [" + res + "]"); // 대괄호 안에 공백이 있는지 확인용

    // res === "ok" 대신 includes를 써서 "ok"가 포함되어 있는지만 봅니다.
    if (res.replace(/\s/g, "") === "ok") {
        checkResult.className = "valid-msg mt-1 text-success";
        checkResult.innerText = "사용 가능한 ID입니다.";
        isIdChecked = true;
    } else {
        checkResult.className = "valid-msg mt-1 text-danger";
        checkResult.innerText = "이미 사용중인 ID입니다.";
        isIdChecked = false;
    }
    updateSubmitButton();
}
      });
  };

  // 닉네임 중복 체크
  const nicknameCheck = () => {
    const nickname = document.getElementById("memberNickname").value.trim();
    const checkResult = document.getElementById("nickname-check-result");

    if (nickname.length < 2) {
        checkResult.className = "valid-msg mt-1 text-danger";
        checkResult.innerText = "닉네임은 2자 이상이어야 합니다.";
        isNicknameChecked = false;
        updateSubmitButton();
        return;
    }

    $.ajax({
        type: "post",
        url: "/member/nickname-check",
        data: { "memberNickname": nickname },
        success: function(res) {
            if (res.trim() === "ok") {
                checkResult.className = "valid-msg mt-1 text-success";
                checkResult.innerText = "사용 가능한 닉네임입니다.";
                isNicknameChecked = true;
            } else {
                checkResult.className = "valid-msg mt-1 text-danger";
                checkResult.innerText = "이미 사용중인 닉네임입니다.";
                isNicknameChecked = false;
            }
            updateSubmitButton();
        }
    });
  };

  // 2. 이메일 인증번호 발송
  const sendEmail = () => {
      const email = document.getElementById("memberEmail").value;
      if(!email) {
          alert("이메일을 입력해주세요.");
          return;
      }
      $.ajax({
          type: "post",
          url: "/member/mail-auth",
          data: { "memberEmail": email },
          success: function(code) {
              alert("인증번호가 발송되었습니다.");
              serverAuthCode = code.toString();
          }
      });
  };

  // 3. 인증번호 일치 확인
  const checkAuthCode = () => {
      const userCode = document.getElementById("authCode").value;
      const resultMsg = document.getElementById("mail-check-result");

      if (userCode === serverAuthCode && serverAuthCode !== "") {
          resultMsg.className = "valid-msg mt-1 text-success";
          resultMsg.innerText = "인증되었습니다.";
          isEmailAuthChecked = true;
          document.getElementById("authCode").readOnly = true;
      } else {
          resultMsg.className = "valid-msg mt-1 text-danger";
          resultMsg.innerText = "인증번호가 일치하지 않습니다.";
          isEmailAuthChecked = false;
      }
      updateSubmitButton();
  };
</script>
</body>
</html>
