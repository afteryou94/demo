<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원정보 수정 - My Board</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .update-container { max-width: 500px; margin-top: 60px; }
        .readonly-field { background-color: #e9ecef !important; cursor: not-allowed; }
        .guide-text { font-size: 0.85rem; color: #6c757d; }
    </style>
</head>
<body>

<div class="container update-container">
    <div class="card shadow-sm border-0">
        <div class="card-body p-5">
            <h2 class="text-center fw-bold mb-4">회원정보 수정</h2>

            <form th:action="@{/member/update}" method="post" th:object="${updateMember}">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label fw-bold">이메일(아이디)</label>
                    <input type="text" th:field="*{memberEmail}" class="form-control readonly-field" readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">이름</label>
                    <input type="text" th:field="*{memberName}" class="form-control readonly-field" readonly>
                </div>

                <div class="mb-3">
                    <label th:for="memberNickname" class="form-label fw-bold">닉네임</label>
                    <input type="text" th:field="*{memberNickname}" id="memberNickname" class="form-control">

                    <div id="nickname-check-result" class="mt-1 small"></div>

                    <div class="invalid-feedback" th:errors="*{memberNickname}"></div>
                    <small class="guide-text d-block mt-1">공백을 제외한 모든 문자로 2~10자를 사용해야 합니다.</small>
                </div>

                <hr class="my-4 text-muted">

                <div th:if="*{memberPassword != null}">
                    <div class="mb-3">
                        <label class="form-label fw-bold text-primary">새 비밀번호</label>
                        <input type="password" name="memberPassword" id="memberPassword" class="form-control"
                               placeholder="변경 시에만 입력하세요"
                               oninput="passwordCheck()"
                               th:classappend="${#fields.hasErrors('memberPassword')} ? 'is-invalid' : ''">

                        <div id="password-check-result" class="mt-1 small"></div>

                        <div class="invalid-feedback" th:errors="*{memberPassword}"></div>
                        <small class="guide-text d-block mt-1">
                            8~16자 영문 대/소문자, 숫자, 특수문자 조합을 사용하세요.
                        </small>
                    </div>
                </div>

                <div th:unless="*{memberPassword != null}" class="alert alert-info py-2 small shadow-sm" role="alert">
                    ✨ 소셜 계정은 닉네임만 수정 가능합니다.
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg fw-bold">수정 완료</button>
                    <a href="/board/" class="btn btn-outline-secondary">수정 취소</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    // CSRF 토큰 정보 가져오기
    const token = $("meta[name='_csrf']").attr("content");
    const header = $("meta[name='_csrf_header']").attr("content");

    // 1. 닉네임 실시간 중복 및 정규식 체크
    $("#memberNickname").on("blur", function() {
        const nickname = $(this).val();
        const $checkResult = $("#nickname-check-result");
        const $submitBtn = $("button[type='submit']");

        // 닉네임 정규식 (특수문자/공백 제외 2~10자)
        const nickRegex = /^[a-zA-Z0-9가-힣]{2,10}$/;

        if (!nickRegex.test(nickname)) {
            $checkResult.text("특수문자와 공백 없이 2~10자로 입력해주세요.").css("color", "red");
            $submitBtn.attr("disabled", true);
            return;
        }

        // 중복 체크 AJAX (CSRF 헤더 포함)
        $.ajax({
            type: "post",
            url: "/member/nickname-check",
            data: { "memberNickname": nickname },
            beforeSend: function(xhr) {
                xhr.setRequestHeader(header, token); // 시큐리티 인증 통과를 위해 필수!
            },
            success: function(res) {
                if (res.trim() === "ok") {
                    $checkResult.text("사용 가능한 닉네임입니다.").css("color", "green");
                    $submitBtn.attr("disabled", false);
                } else {
                    $checkResult.text("이미 사용 중인 닉네임입니다.").css("color", "red");
                    $submitBtn.attr("disabled", true);
                }
            },
            error: function() {
                console.log("AJAX 오류 발생");
            }
        });
    });

    // 2. 비밀번호 실시간 유효성 검사
    $("#memberPassword").on("input", function() {
        const password = $(this).val();
        const $passResult = $("#password-check-result");
        const $submitBtn = $("button[type='submit']");

        // 비밀번호 정규식 (영문 대/소문자, 숫자, 특수문자 포함 8~16자)
        const passRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,16}$/;

        if (password === "") {
            $passResult.text(""); // 비어있으면 메시지 삭제
            $submitBtn.attr("disabled", false);
            return;
        }

        if (passRegex.test(password)) {
            $passResult.text("안전한 비밀번호입니다.").css("color", "green");
            $submitBtn.attr("disabled", false);
        } else {
            $passResult.text("8~16자 영문 대/소문자, 숫자, 특수문자를 모두 포함해야 합니다.").css("color", "red");
            $submitBtn.attr("disabled", true);
        }
    });
</script>

<div id="nickname-check-result" class="mt-1 small"></div>

</body>
</html>
