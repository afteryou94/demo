<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원정보 수정 - My Board</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .update-container { max-width: 500px; margin-top: 60px; }
        .readonly-field { background-color: #e9ecef !important; cursor: not-allowed; }
        .guide-text { font-size: 0.85rem; color: #6c757d; }
    </style>
</head>
<body>

<div class="container update-container">
    <div class="card shadow-sm border-0">
        <div class="card-body p-5">
            <h2 class="text-center fw-bold mb-4">회원정보 수정</h2>

            <form th:action="@{/member/update}" method="post" th:object="${updateMember}">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label fw-bold">이메일(아이디)</label>
                    <input type="text" th:field="*{memberEmail}" class="form-control readonly-field" readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">이름</label>
                    <input type="text" th:field="*{memberName}" class="form-control readonly-field" readonly>
                </div>

                <div class="mb-3">
                    <label th:for="memberNickname" class="form-label fw-bold">닉네임</label>
                    <input type="text" th:field="*{memberNickname}" class="form-control"
                           th:classappend="${#fields.hasErrors('memberNickname')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback" th:errors="*{memberNickname}"></div>
                    <small class="guide-text d-block mt-1">
                        공백을 제외한 모든 문자로 2~10자를 사용해야 합니다.
                    </small>
                </div>

                <hr class="my-4 text-muted">

                <div th:if="*{memberPassword != null}">
                    <div class="mb-3">
                        <label class="form-label fw-bold text-primary">새 비밀번호</label>
                        <input type="password" name="memberPassword" class="form-control"
                               placeholder="변경 시에만 입력하세요"
                               th:classappend="${#fields.hasErrors('memberPassword')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:errors="*{memberPassword}"></div>
                        <small class="guide-text d-block mt-1">
                            보안을 위해 8~16자 영문, 숫자, 특수문자 조합을 권장합니다.
                        </small>
                    </div>
                </div>

                <div th:unless="*{memberPassword != null}" class="alert alert-info py-2 small shadow-sm" role="alert">
                    ✨ 소셜 계정은 닉네임만 수정 가능합니다.
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg fw-bold">수정 완료</button>
                    <a href="/board/" class="btn btn-outline-secondary">수정 취소</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
