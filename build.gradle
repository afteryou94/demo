plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.10'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.jetbrains.kotlin.jvm'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	dependencies {
		// 스프링 데이터 JPA: 인터페이스 기반으로 데이터베이스(DB)를 쉽게 다루게 해주는 핵심 라이브러리
		implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

		// 타임리프: 컨트롤러에서 보낸 데이터를 HTML에 뿌려주는 서버 사이드 템플릿 엔진
		implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

		// 스프링 웹: REST API 제작 및 내장 톰캣(Tomcat)을 포함한 웹 개발 필수 라이브러리
		implementation 'org.springframework.boot:spring-boot-starter-web'

		// 롬복: Getter, Setter, 생성자 등을 어노테이션(@)으로 자동 생성해주는 도구
		//롬복은 실제 실행(Runtime) 시점에는 필요 없고, 코드를 작성하고 컴파일하는 과정에서만 Getter/Setter를 만들어주면 되기 때문, 덕분에 최종 결과물(JAR 파일)의 용량을 줄일 수 있다
		compileOnly 'org.projectlombok:lombok'
		annotationProcessor 'org.projectlombok:lombok'

		// MySQL 커넥터: 자바 프로그램과 MySQL 데이터베이스를 연결해주는 드라이버
		runtimeOnly 'com.mysql:mysql-connector-j'

		// 테스트 라이브러리: JUnit 등을 활용하여 코드의 정상 동작을 확인하는 테스트 환경 제공
		testImplementation 'org.springframework.boot:spring-boot-starter-test'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

		// 코틀린 표준 라이브러리: 프로젝트 내에서 코틀린 언어 기능을 사용할 수 있게 해줌
		implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"

		// 이메일 서비스: 인증 번호 전송이나 알림 메일 발송 기능을 위한 라이브러리
		implementation 'org.springframework.boot:spring-boot-starter-mail'

		// 소셜 로그인을 위한 핵심 라이브러리 (Google, Kakao, Naver 등 OAuth2 인증 구현)
		implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

		// 스프링 시큐리티: 웹 보안(인증, 인가) 및 페이지 접근 권한 관리를 담당
		implementation 'org.springframework.boot:spring-boot-starter-security'

		// 타임리프 시큐리티 확장: HTML(Thymeleaf)에서 로그인 여부에 따라 버튼을 숨기거나 보여주는 기능 제공
		implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

		// 유효성 검사: @Size, @NotEmpty 등 어노테이션으로 입력값의 길이나 형식을 검증
		implementation 'org.springframework.boot:spring-boot-starter-validation'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
